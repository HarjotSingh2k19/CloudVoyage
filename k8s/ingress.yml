apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudvoyage-ingress
  namespace: cloudvoyage
spec:
  rules:
    - host: wanderlust.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80